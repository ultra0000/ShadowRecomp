name: build-linux
on:
  workflow_call:
    secrets:
      ASSET_REPO:
        required: true
      ASSET_REPO_TOKEN:
        required: true

jobs:
  build-linux:
    name: Build Linux (${{ matrix.arch.name }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      matrix:
        arch: [
          {"name": "x86_64", "runner": "ubuntu-26.04"},
        ]
        preset: [
          "linux-release",
          #"linux-relwithdebinfo"
        ]
    env:
      LLVM_VERSION: 22
      CMAKE_PRESET: ${{ matrix.preset }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          allow-unsafe-pr-checkout: true
          token: ${{ secrets.ASSET_REPO_TOKEN }}

      # HACK: Fine-grained token can't access cross-org repos.
      # REMOVE when XboxRecomp2 & assets repo go public.
      - name: Checkout Submodules
        env:
          TOKEN: ${{ secrets.ASSET_REPO_TOKEN }}
        run: >-
          git -c "url.https://x-access-token:${TOKEN}@github.com/.insteadOf=https://github.com/"
          -c submodule.tools/XboxRecomp2.update=none
          submodule update --init --recursive

      - name: Fetch vcpkg baseline
        run: git -C thirdparty/vcpkg fetch --depth=1 origin $(jq -r '."builtin-baseline"' vcpkg.json)

      - name: Checkout Private Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.ASSET_REPO }}
          token: ${{ secrets.ASSET_REPO_TOKEN }}
          path: ./private

      - name: Install Dependencies
        run: |-
          sudo apt update
          sudo apt install -y ninja-build clang-${{ env.LLVM_VERSION }} lld-${{ env.LLVM_VERSION }} llvm-${{ env.LLVM_VERSION }} \
          autoconf autoconf-archive automake libtool libltdl-dev gettext python3-venv \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libsm-dev libice-dev \
          libwayland-dev libdecor-0-dev libxkbcommon-dev libegl-dev libgl-dev \
          libasound2-dev libpulse-dev libpipewire-0.3-dev \
          libdbus-1-dev libibus-1.0-dev libudev-dev
          echo "/usr/lib/llvm-${{ env.LLVM_VERSION }}/bin" >> $GITHUB_PATH

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.arch.name }}-${{ matrix.preset }}

      - name: Cache vcpkg
        uses: actions/cache@v6
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ matrix.arch.name }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch.name }}-

      - name: Prepare Project
        run: cp ./private/* ./ShadowRecompLib/private

      - name: Configure Project
        run: cmake . --preset ${{ env.CMAKE_PRESET }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DSHADOW_RECOMP_XBOXRECOMP2=binary

      - name: Build Project
        run: cmake --build ./out/build/${{ env.CMAKE_PRESET }} --target ShadowRecomp

      - name: Pack Release
        run: tar -czf ./ShadowRecomp-Linux-${{ matrix.arch.name }}-${{ env.CMAKE_PRESET }}.tar.gz -C ./out/build/${{ env.CMAKE_PRESET }}/ShadowRecomp ShadowRecomp libdxcompiler.so

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShadowRecomp-Linux-${{ matrix.arch.name }}-${{ env.CMAKE_PRESET }}
          path: ./ShadowRecomp-Linux-${{ matrix.arch.name }}-${{ env.CMAKE_PRESET }}.tar.gz
          retention-days: 3

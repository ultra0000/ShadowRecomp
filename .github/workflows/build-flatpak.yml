name: build-flatpak
on:
  workflow_call:
    secrets:
      ASSET_REPO:
        required: true
      ASSET_REPO_TOKEN:
        required: true

jobs:
  build-flatpak:
    name: Build Flatpak (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      matrix:
        arch: [
          {"name": "x86_64", "runner": "ubuntu-26.04"},
          ]
    env:
      FLATPAK_ID: io.github.foxworkshop.shadowrecomp

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          allow-unsafe-pr-checkout: true
          token: ${{ secrets.ASSET_REPO_TOKEN }}

      # TODO: HACK: Fine-grained token can't access cross-org repos.
      # REMOVE when XboxRecomp2 & assets repo go public.
      - name: Checkout Submodules
        env:
          TOKEN: ${{ secrets.ASSET_REPO_TOKEN }}
        run: >-
          git -c "url.https://x-access-token:${TOKEN}@github.com/.insteadOf=https://github.com/"
          -c submodule.tools/XboxRecomp2.update=none
          submodule update --init --recursive

      - name: Fetch vcpkg baseline
        run: git -C thirdparty/vcpkg fetch --depth=1 origin $(jq -r '."builtin-baseline"' vcpkg.json)

      - name: Checkout Private Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.ASSET_REPO }}
          token: ${{ secrets.ASSET_REPO_TOKEN }}
          path: ./private

      - name: Install Dependencies
        run: |-
          sudo apt update
          sudo apt install -y flatpak-builder ccache

      - name: Setup ccache
        uses: actions/cache@v6
        with:
          path: /tmp/ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch.name }}

      - name: Prepare Project
        run: cp ./private/* ./ShadowRecompLib/private

      - name: Download XboxRecomp2
        run: cmake -DVERSION=0.4.0 -DDESTINATION=out/xr2-bin -P ShadowRecompLib/cmake/recompile/select/download.cmake

      - name: Prepare Flatpak
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      # flatpak-builder ignores ref, set the flag manually
      - name: Tag Build Prep
        if: github.ref_type == 'tag'
        run: sed -i 's/-DSHADOW_RECOMP_FLATPAK=ON/-DSHADOW_RECOMP_FLATPAK=ON -DSHADOW_RECOMP_TAG_BUILD=ON/' ./flatpak/${{ env.FLATPAK_ID }}.json

      - name: Build Flatpak
        run: |
          echo "commit_message=$(git log -1 --pretty=%s)" >> $GITHUB_ENV
          export CCACHE_DIR=/tmp/ccache
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=repo --ccache builddir ./flatpak/${{ env.FLATPAK_ID }}.json
          flatpak build-bundle repo ./${{ env.FLATPAK_ID }}.flatpak ${{ env.FLATPAK_ID }} --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShadowRecomp-Flatpak-${{ matrix.arch.name }}
          path: ./${{ env.FLATPAK_ID }}.flatpak
          retention-days: 3
